services:
  mysql:
    image: mysql:8.3
    restart: unless-stopped
    env_file: .env
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - api_network
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$MYSQL_ROOT_PASSWORD --silent" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
  migrate:
    image: migrate/migrate:v4.17.1
    restart: "no"
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - api_network
    volumes:
      - ./database/migrations:/migrations
    entrypoint:
      [
        "sh",
        "-c",
        "migrate -path /migrations -database \"$DATABASE_URL?x-migrations-table=schema_migrations\" up"
      ]
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - api_network
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - .env
    container_name: php_api
    ports:
      - "8080:8080"
    volumes:
      - .:/api
    working_dir: /api
    networks:
      - api_network

volumes:
  mysql_data:

networks:
  api_network: